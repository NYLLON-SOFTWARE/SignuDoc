name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The build prerenders the legal pages, which read these values. They
      # are placeholders, not secrets.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          APP_URL: https://ci.signudoc.example
          BETTER_AUTH_URL: https://ci.signudoc.example
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
          SUPPORT_EMAIL: support@ci.signudoc.example

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signudoc
          POSTGRES_PASSWORD: signudoc
          POSTGRES_DB: signudoc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signudoc -d signudoc_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://signudoc:signudoc@127.0.0.1:5432/signudoc_e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
